<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATHANATOS - أثاناتوس</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1020;
color:white;
line-height:1.8;
}
header{
padding:20px;
background:#151d35;
text-align:center;
border-bottom:2px solid #7665ff;
position:sticky;
top:0;
z-index:100;
}
header h1{
color:#a99cff;
font-size:26px;
margin:0;
}
header p{color:#c4c9df;margin:5px 0 0 0;font-size:14px}
main{padding:20px;max-width:800px;margin:0 auto}
.reader-tools{
display:flex;
justify-content:space-between;
align-items:center;
background:#11182c;
padding:10px 15px;
border-radius:10px;
margin-bottom:20px;
border:1px solid #293353;
}
.btn-tool{
background:#293353;
color:white;
border:none;
padding:6px 14px;
border-radius:6px;
cursor:pointer;
font-size:14px;
}
.chapter-container{
background:#151d35;
padding:25px;
border-radius:16px;
border:1px solid #293353;
box-shadow:0 4px 15px rgba(0,0,0,0.3);
}
.chapter-title{
color:#c3b7ff;
font-size:24px;
border-bottom:1px solid #293353;
padding-bottom:10px;
margin-top:0;
text-align:center;
}
.chapter-text{
font-size:18px;
color:#e0e5f5;
text-align:justify;
white-space:pre-line;
}
footer{
text-align:center;
padding:20px;
color:#9da6c5;
font-size:13px;
}
</style>
</head>
<body>

<header>
<h1>ATHANATOS</h1>
<p>رواية الخيال والأساطير - بقلم يوسف أمبارك</p>
</header>

<main>
<div class="reader-tools">
<span>📖 الفصل الأول</span>
<div>
<button class="btn-tool" onclick="changeFontSize(1)">A+</button>
<button class="btn-tool" onclick="changeFontSize(-1)">A-</button>
</div>
</div>

<div class="chapter-container">
<h2 class="chapter-title">الفصل الأول: البداية</h2>
<div class="chapter-text" id="storyText">
هنا تبدأ أحداث رواية أثاناتوس المشوقة... ضع نص الفصل الأول الخاص بك هنا وسيعمل بشكل مريح للقراءة.
</div>
</div>
</main>

<footer>
© 2026 ATHANATOS - جميع الحقوق محفوظة
</footer>

<script>
let currentSize = 18;
function changeFontSize(delta) {
currentSize += delta;
if(currentSize < 14) currentSize = 14;
if(currentSize > 26) currentSize = 26;
document.getElementById('storyText').style.fontSize = currentSize + 'px';
}
</script>

</body>
</html>
